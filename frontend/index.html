<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FestPass 2026</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input, select, button { margin: .25rem 0; padding: .5rem; }
    #status { padding: .5rem; background: #eef2ff; overflow-wrap: anywhere; }
    li { margin: .5rem 0; }
  </style>
</head>
<body>
  <h1>FestPass 2026 registrations</h1>
  <p id="status">Checking the backend…</p>
  <form id="form">
    <input id="name" placeholder="Your name" required>
    <select id="event">
      <option>Hackathon</option>
      <option>Robo Race</option>
      <option>Tech Quiz</option>
    </select>
    <button type="submit">Register</button>
  </form>
  <ul id="list"></ul>
  <script>
    const api = (path, options) =>
      fetch("/api/" + path, options).then(async response => {
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || "Request failed");
        return data;
      });

    async function refresh() {
      const status = document.getElementById("status");
      try {
        const health = await api("health");
        status.textContent =
          `REGNO ${health.regno} | backend ${health.version} on ${health.container} | database ${health.database ? "connected" : "not connected"}`;
        const rows = await api("registrations");
        document.getElementById("list").replaceChildren(
          ...rows.map(row => {
            const item = document.createElement("li");
            item.textContent = `#${row.id} ${row.name} (${row.event})`;
            return item;
          })
        );
      } catch (_error) {
        status.textContent = "Backend not reachable";
      }
    }

    document.getElementById("form").addEventListener("submit", async event => {
      event.preventDefault();
      try {
        await api("registrations", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            name: document.getElementById("name").value,
            event: document.getElementById("event").value
          })
        });
        document.getElementById("name").value = "";
        await refresh();
      } catch (error) {
        document.getElementById("status").textContent = error.message;
      }
    });

    refresh();
  </script>
</body>
</html>
